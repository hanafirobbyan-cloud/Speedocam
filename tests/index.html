<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeedoCam tests</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 16px; background: #000; color: #f5f5f7; font: 14px/1.45 -apple-system, system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.note { color: #8e8e93; margin: 0 0 12px; }
    #summary { font-weight: 700; margin: 12px 0; }
    li { margin: 2px 0; }
    .ok { color: #30d158; } .fail { color: #ff453a; }
    pre { white-space: pre-wrap; color: #ff9f0a; margin: 2px 0 6px 18px; font-size: 12px; }
    #stage { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    #stage canvas, #stage video { width: 240px; background: #222; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>SpeedoCam test suite</h1>
  <p class="note">Unit tests for GPS, units, stats, settings, storage, exporters and overlay, plus a recording-pipeline test that uses a synthetic test video source (test page only — the app never uses simulated data).</p>
  <div id="summary">Running…</div>
  <ul id="results"></ul>
  <div id="stage"></div>
  <script type="module" src="./tests.js"></script>
</body>
</html>
